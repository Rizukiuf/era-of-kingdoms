# Runs on every push to main or a claude/* branch, on every pull request, and on demand.
# Catches crashes, stale builds and broken UI before a change is merged,
# including changes written by AI agents.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # every file the build writes; all of them are committed and served by GitHub Pages
  BUILT: index.html sw.js manifest.webmanifest icon.svg icon-180.png icon-192.png icon-512.png

jobs:
  build-and-simulate:
    name: Build + headless simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build index.html and the app files from src/ (Node)
        run: node build.mjs

      - name: Built files in the commit must match src/
        run: |
          if [ -n "$(git status --porcelain -- $BUILT)" ]; then
            git status --short -- $BUILT
            echo "::error::Built files are out of date or not committed. Run 'node build.mjs' (or 'python3 build.py') and commit: $BUILT"
            exit 1
          fi

      - name: Python build gives the same files
        run: |
          python3 build.py
          git status --short -- $BUILT
          test -z "$(git status --porcelain -- $BUILT)"

      - name: Simulation — 2 players, continental, 30 min
        run: node tools/sim-test.mjs 30 continental 80 1234 majapahit,britons hard,hard

      - name: Simulation — 3 players, rivers, 30 min
        run: node tools/sim-test.mjs 30 rivers 96 7 majapahit,japanese,ottomans hard,hardest,normal

      - name: Simulation — 4 players, coastal, 20 min
        run: node tools/sim-test.mjs 20 coastal 96 42 franks,mongols,byzantines,chinese normal,hard,easy,hardest

  browser-smoke:
    name: Browser smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Play the game in headless Chromium
        run: node tools/browser-smoke.mjs

      - name: Install as an app, play offline, update (service worker)
        if: ${{ !cancelled() }}
        run: node tools/pwa-check.mjs

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tools/screenshots/
          if-no-files-found: ignore
